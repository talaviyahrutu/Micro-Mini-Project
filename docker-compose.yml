version: '3.8'

services:
  # MongoDB Database Service with Persistent Named Volume
  mongo:
    image: mongo:7-jammy
    container_name: sentinel_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - sentinel_mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "echo 'db.runCommand(\"ping\").ok' | mongosh --quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - sentinel_net

  # Backend API Service (Node.js & Express)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentinel_backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/apisentinel
      JWT_SECRET: ${JWT_SECRET:-sentinel_production_docker_jwt_key_9876543210_api}
      JWT_EXPIRES_IN: 7d
      AUTO_PING_ENABLED: "true"
      PING_DEFAULT_INTERVAL_SEC: 30
      SSRF_ALLOW_PRIVATE_IPS: "true"
      CORS_ORIGIN: http://localhost:3000,http://frontend:80
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/healthz"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - sentinel_net

  # Frontend Web UI (React + Vite served via Nginx Reverse Proxy)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sentinel_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - sentinel_net

volumes:
  sentinel_mongo_data:
    name: sentinel_mongo_data
    driver: local

networks:
  sentinel_net:
    name: sentinel_network
    driver: bridge
