apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  labels:
    app: sentinel
    component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sentinel
      component: backend
  template:
    metadata:
      labels:
        app: sentinel
        component: backend
    spec:
      containers:
        - name: backend
          image: sentinel-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "300m"
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app: sentinel
    component: backend
spec:
  selector:
    app: sentinel
    component: backend
  ports:
    - port: 5000
      targetPort: 5000
  type: ClusterIP
