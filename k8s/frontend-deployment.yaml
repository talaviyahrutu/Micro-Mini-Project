apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  labels:
    app: sentinel
    component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sentinel
      component: frontend
  template:
    metadata:
      labels:
        app: sentinel
        component: frontend
    spec:
      containers:
        - name: frontend
          image: sentinel-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  labels:
    app: sentinel
    component: frontend
spec:
  type: NodePort
  selector:
    app: sentinel
    component: frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
