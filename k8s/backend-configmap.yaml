apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  labels:
    app: sentinel
    component: backend
data:
  NODE_ENV: "production"
  PORT: "5000"
  AUTO_PING_ENABLED: "true"
  PING_DEFAULT_INTERVAL_SEC: "30"
  SSRF_ALLOW_PRIVATE_IPS: "true"
  CORS_ORIGIN: "http://localhost:3000,http://frontend-service:80"
---
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  labels:
    app: sentinel
    component: backend
type: Opaque
stringData:
  MONGODB_URI: "mongodb://mongo-service:27017/apisentinel"
  JWT_SECRET: "sentinel_k8s_super_secure_jwt_token_secret_key_84920"
