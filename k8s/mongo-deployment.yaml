apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-deployment
  labels:
    app: sentinel
    component: mongodb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sentinel
      component: mongodb
  template:
    metadata:
      labels:
        app: sentinel
        component: mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:7-jammy
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: mongo-storage
              mountPath: /data/db
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: mongo-storage
          persistentVolumeClaim:
            claimName: mongo-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: mongo-service
  labels:
    app: sentinel
    component: mongodb
spec:
  selector:
    app: sentinel
    component: mongodb
  ports:
    - port: 27017
      targetPort: 27017
  type: ClusterIP
